<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Almoxarifado — Contagem</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px calc(108px + env(safe-area-inset-bottom));}
header{padding:22px 2px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:25px;margin:0;font-weight:800;letter-spacing:-.7px}.sub{color:#737780;font-size:13px;margin-top:4px}
.card{background:#fff;border:1px solid #e7e8eb;border-radius:20px;box-shadow:0 5px 20px #00000008;margin-bottom:12px}
.controls{padding:14px}.row{display:flex;gap:9px}.input{width:100%;border:0;background:#f1f2f4;border-radius:14px;padding:14px;font-size:16px;outline:0;min-width:0}.input:focus{box-shadow:inset 0 0 0 2px #17191d}
button{border:0;font:inherit;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}.add{background:#111318;color:#fff;border-radius:14px;padding:0 18px;min-width:92px}
.stats{display:flex;gap:10px;padding:0 2px 12px}.stat{flex:1;background:#fff;border:1px solid #e7e8eb;border-radius:17px;padding:12px 14px}.num{font-size:22px;font-weight:800}.label{font-size:11px;color:#7b7f87;margin-top:2px}
.list{overflow:hidden}.empty{padding:42px 20px;text-align:center;color:#7b7f87}.empty b{display:block;color:#292c32;margin-bottom:6px}
.item{display:flex;align-items:center;padding:14px 15px;border-bottom:1px solid #eee;gap:12px}.item:last-child{border-bottom:0}.info{flex:1;min-width:0}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:#888d96;margin-top:3px}.counter{display:flex;align-items:center;gap:8px}.circle{width:38px;height:38px;border-radius:12px;background:#eef0f2;color:#17191d;font-size:21px}.qty{min-width:30px;text-align:center;font-size:17px;font-weight:800}.del{background:transparent;color:#a0a3aa;font-size:18px;padding:8px 3px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#f4f5f7eF;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:5}.bottomin{max-width:728px;margin:auto;display:flex;gap:9px}.pdf{flex:1;background:#111318;color:#fff;border-radius:16px;padding:16px;font-size:15px;box-shadow:0 8px 25px #0002}.clear{background:#fff;border:1px solid #dddfe3;border-radius:16px;padding:0 17px;color:#555a63}
dialog{border:0;border-radius:22px;padding:0;width:min(92%,430px);box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0006}.modal{padding:20px}.modal h2{margin:0 0 15px;font-size:21px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:#777b84;margin:0 0 6px 3px}.actions{display:flex;gap:9px;margin-top:15px}.actions button{flex:1;padding:14px;border-radius:14px}.cancel{background:#eee}.save{background:#111318;color:#fff}
@media(min-width:700px){.app{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Almoxarifado</h1><div class="sub">Contagem de estoque</div></div></header>
<section class="card controls">
  <div class="row"><input id="search" class="input" placeholder="🔎  Buscar item..." autocomplete="off"><button class="add" onclick="openAdd()">+ Item</button></div>
</section>
<div class="stats">
  <div class="stat"><div id="itemCount" class="num">0</div><div class="label">ITENS</div></div>
  <div class="stat"><div id="unitCount" class="num">0</div><div class="label">UNIDADES</div></div>
</div>
<section class="card list" id="list"></section>
</div>
<div class="bottom"><div class="bottomin"><button class="clear" onclick="clearAll()">Limpar</button><button class="pdf" onclick="makePDF()">📄 Emitir PDF</button></div></div>

<dialog id="dlg"><div class="modal">
<h2>Adicionar item</h2>
<div class="field"><label>Nome do item</label><input id="name" class="input" placeholder="Ex.: Luva de látex"></div>
<div class="field"><label>Código / referência (opcional)</label><input id="code" class="input" placeholder="Ex.: CA 25313"></div>
<div class="field"><label>Quantidade</label><input id="initial" class="input" type="number" inputmode="numeric" min="0" value="0"></div>
<div class="actions"><button class="cancel" onclick="dlg.close()">Cancelar</button><button class="save" onclick="saveItem()">Adicionar</button></div>
</div></dialog>

<script>
const KEY="almox_contagem_v1";
let items=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function render(){
 const q=$("search").value.toLowerCase().trim();
 const shown=items.filter(x=>(x.name+" "+(x.code||"")).toLowerCase().includes(q));
 $("itemCount").textContent=items.length;
 $("unitCount").textContent=items.reduce((s,x)=>s+x.qty,0);
 $("list").innerHTML=shown.length?shown.map(x=>`<div class="item">
 <div class="info"><div class="name">${esc(x.name)}</div><div class="meta">${x.code?esc(x.code)+" · ":""}Atualizado agora</div></div>
 <div class="counter"><button class="circle" onclick="change('${x.id}',-1)">−</button><div class="qty">${x.qty}</div><button class="circle" onclick="change('${x.id}',1)">+</button></div>
 <button class="del" onclick="removeItem('${x.id}')" aria-label="Excluir">×</button></div>`).join(""):`<div class="empty"><b>${q?"Nenhum item encontrado":"Comece sua contagem"}</b>${q?"Tente outro nome.":"Toque em “+ Item” para adicionar o primeiro material."}</div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openAdd(){["name","code","initial"].forEach(id=>$(id).value=id==="initial"?"0":"");$("dlg").showModal();setTimeout(()=>$("name").focus(),80)}
function saveItem(){let name=$("name").value.trim();if(!name){$("name").focus();return}items.push({id:crypto.randomUUID(),name,code:$("code").value.trim(),qty:Math.max(0,parseInt($("initial").value||0,10))});save();$("dlg").close()}
function change(id,n){let x=items.find(x=>x.id===id);if(x){x.qty=Math.max(0,x.qty+n);save()}}
function removeItem(id){items=items.filter(x=>x.id!==id);save()}
function clearAll(){if(items.length&&confirm("Apagar toda a contagem atual?")){items=[];save()}}
$("search").addEventListener("input",render);

function makePDF(){
 if(!items.length){alert("Adicione pelo menos um item antes de emitir o PDF.");return}
 const now=new Date(), date=now.toLocaleDateString("pt-BR"), time=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 const rows=items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.code||"—")}</td><td class="right">${x.qty}</td></tr>`).join("");
 const total=items.reduce((s,x)=>s+x.qty,0);
 const w=window.open("","_blank");
 if(!w){alert("O iPhone bloqueou a nova janela. Permita pop-ups para este site e tente novamente.");return}
 w.document.write(`<!doctype html><html lang="pt-BR"><head><meta name="viewport" content="width=device-width"><title>Contagem de Estoque</title>
 <style>@page{size:A4;margin:16mm}body{font-family:-apple-system,BlinkMacSystemFont,Arial;color:#16181c}h1{font-size:24px;margin:0 0 4px}.muted{color:#70747c;font-size:12px;margin-bottom:24px}.box{border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:18px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;background:#f2f3f5}th,td{padding:9px;border-bottom:1px solid #e4e5e7}th{border-bottom:2px solid #ccc}.right{text-align:right;font-weight:bold}.total{text-align:right;margin-top:16px;font-weight:bold;font-size:14px}@media print{.noprint{display:none}}</style></head>
 <body><h1>CONTAGEM DE ESTOQUE</h1><div class="muted">Almoxarifado · ${date} às ${time}</div><div class="box"><table><thead><tr><th>#</th><th>Item</th><th>Código / Referência</th><th class="right">Quantidade</th></tr></thead><tbody>${rows}</tbody></table><div class="total">Total de unidades: ${total}</div></div>
 <button class="noprint" onclick="window.print()">📄 Salvar / Imprimir PDF</button></body></html>`);
 w.document.close();setTimeout(()=>w.print(),400)
}
render();
</script>
</body></html>
